name: Presentation checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: presentation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  presentation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: node --test tests/presentation.test.ts
      - name: Install the pinned capture runtime
        run: npm install --no-save --package-lock=false playwright@1.64.0
      - run: npx playwright install --with-deps chromium
      - name: Capture the current dashboard
        run: node tests/capture-dashboard.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dashboard-current
          path: presentation-captures/
          if-no-files-found: error
          retention-days: 7
